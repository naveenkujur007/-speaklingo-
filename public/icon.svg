<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: rounded square with sky-to-emerald gradient -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Large speech bubble (main icon = "speak") -->
  <g filter="url(#glow)">
    <path d="M 120 160
             Q 120 120 160 120
             L 352 120
             Q 392 120 392 160
             L 392 300
             Q 392 340 352 340
             L 220 340
             L 170 390
             Q 160 400 155 390
             L 165 340
             Q 120 340 120 300
             Z"
          fill="#ffffff"/>
  </g>

  <!-- Sound waves inside bubble (= "speaking") -->
  <g filter="url(#glow)">
    <!-- Wave 1 (left, small) -->
    <path d="M 180 220 Q 170 230 180 240" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.5"/>
    <!-- Wave 2 (center, large) -->
    <path d="M 220 200 Q 200 230 220 260" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Wave 3 (right, medium) -->
    <path d="M 260 210 Q 245 230 260 250" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- Wave 4 (far right, small) -->
    <path d="M 300 220 Q 290 230 300 240" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>

  <!-- Globe dots inside bubble (= "languages/world") -->
  <g opacity="0.3">
    <circle cx="180" cy="280" r="4" fill="#10b981"/>
    <circle cx="256" cy="290" r="4" fill="#10b981"/>
    <circle cx="330" cy="280" r="4" fill="#10b981"/>
  </g>
</svg>
